name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Both pinned toolchains live under this dir; they only change when
      # the fw-release pin bumps, so key the cache on the pin file.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rgb-sunglasses
          key: toolchains-${{ hashFiles('cmake/fw-release.cmake') }}

      # All three targets. The rgbx-v2 preset runs the SDK's post-link pass,
      # its structural gate and tick oracle, the package builder, and this
      # repo's known-answer parity tests inside the build, so a module the
      # firmware would refuse, or one that no longer paints Plasma, fails this
      # step rather than reaching a device.
      - name: Build every target (strict toolchain)
        run: ./build.sh -DRGBX_STRICT_TOOLCHAIN=ON

      # The .rgbx container is supposed to be a function of the source
      # revision and the SDK pin, and of nothing else. Build it a second time
      # in a differently named directory and require identical bytes: same
      # binaryDir would compare two builds that could both embed the same
      # absolute path and still look reproducible. The SDK and the toolchains
      # are already resolved by then, so this costs a compile, not a download.
      - name: Check the RGBX package is reproducible
        run: |
          cmake -S . -B build/rgbx-v2-repro -DRGBX_TARGET=rgbx-v2 -DRGBX_STRICT_TOOLCHAIN=ON
          cmake --build build/rgbx-v2-repro
          cmp build/rgbx-v2/plasma.rgbx build/rgbx-v2-repro/plasma.rgbx
          cmp build/rgbx-v2/plasma.wasm build/rgbx-v2-repro/plasma.wasm
          sha256sum build/rgbx-v2/plasma.wasm build/rgbx-v2/plasma.rgbx

      # Two builds of one revision agree with each other whatever they built,
      # so also assert the bytes this repository is supposed to produce. The
      # module digest is the whole claim of the RGBX v2 port: it is the module
      # the firmware repository already carries as its conformance fixture, and
      # it comes out the same from the pinned wasi-sdk on Linux here and on
      # macOS locally.
      #
      # The two digests move for different reasons, so read a failure
      # accordingly. plasma.wasm is compiled, post-linked and gated before the
      # packager ever reads rgbx-v2.json, so only src/main_v2.c or the SDK pin
      # can move it, and moving it changes the animation on every device that
      # ships this effect. plasma.rgbx carries the manifest as well, and the
      # manifest records the SHA-256 of the translation unit, so a version bump
      # or even a comment-only source edit moves that one on its own while the
      # module stays identical; when it does, this line is updated in the same
      # commit, which is the point at which the change gets stated rather than
      # slipping through.
      #
      # Only the v2 artifacts are pinned here. The .llext and simulator .wasm
      # come from toolchains whose cross-OS byte-identity this repository has
      # not established, and neither is what the port claim rests on.
      - name: Check the RGBX artifacts match their recorded digests
        run: |
          echo "78506a11c786abc2085bb77c9982418b2a5e27c3242a9b85d04e5320ba8e1b24  build/rgbx-v2/plasma.wasm" | sha256sum -c
          echo "90e882079bb0b913611220acdeba2b6bf9572e5397500ba58e223a737f5812af  build/rgbx-v2/plasma.rgbx" | sha256sum -c

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            build/arm/*.llext
            build/wasm/*.wasm
            build/rgbx-v2/*.rgbx
